<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stamp Run · 같이 달려요</title>

  <!-- 카톡/SNS 미리보기 카드 (OpenGraph) -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="🏃 Stamp Run · 같이 달려요">
  <meta property="og:description" content="우리 동네 러닝 코스에 도전하세요. 첫 골드 스탬프의 주인공이 되어보세요.">
  <meta property="og:image"       content="https://leebongcheol.github.io/stamprun-web/og-image.png">
  <meta property="og:url"         content="https://leebongcheol.github.io/stamprun-web/">
  <meta property="og:site_name"   content="Stamp Run">
  <meta property="og:locale"      content="ko_KR">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:title"      content="🏃 Stamp Run · 같이 달려요">
  <meta name="twitter:description" content="우리 동네 러닝 코스에 도전하세요.">
  <meta name="twitter:image"      content="https://leebongcheol.github.io/stamprun-web/og-image.png">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #2563EB; }
  </style>
</head>
<body>
  <script>
  (function () {
    const path = location.pathname.split('/').filter(Boolean);
    const courseId = path[path.length - 1] || '';
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua);
    const isAndroid = /Android/.test(ua);

    const STORE_IOS     = "https://apps.apple.com/kr/app/stamp-run/id6772842094";
    const STORE_ANDROID = "https://play.google.com/store/apps/details?id=com.stamprun.app";
    const FALLBACK      = "https://leebongcheol.github.io/stamprun-web/";

    const storeUrl = isIOS ? STORE_IOS : isAndroid ? STORE_ANDROID : FALLBACK;

    if (isIOS || isAndroid) {
      // 앱 scheme 시도 — iframe 으로 화면 깜빡임 없이 호출
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = "stamprun://course/" + courseId;
      document.body.appendChild(iframe);

      // 짧은 시간 후에도 페이지 살아있으면 = 앱 미설치 → 스토어로
      // (앱이 열리면 visibility hidden 이 됨)
      setTimeout(function () {
        if (document.hidden) return;
        location.href = storeUrl;
      }, 500);
    } else {
      // 데스크탑/기타 — 메인 페이지
      location.href = FALLBACK;
    }
  })();
  </script>
</body>
</html>
