<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<style> html,body,#map { margin:0; padding:0; height:100%; } </style>
</head>
<body>
<div id="map"></div>
<script>
  // RN 이 injectedJavaScript 로 주입:
  //   window.MAP_DATA = { center, level, courses, userLocation }
  //   window.KAKAO_JS_KEY = "..."
  const post = (obj) => window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(obj));
  window.onerror = (message, source, lineno) => post({ type: 'error', message: String(message), source: String(source||''), lineno });

  // 동적 업데이트용 전역 상태
  let MAP = null;
  let COURSE_OVERLAYS = []; // { line, marker } 배열 (코스 polyline + 라벨)
  let USER_OVERLAY = null;  // 내 위치 마커
  let PENDING_DATA = null;  // 맵 init 전 도착한 updateMapData 인자 (레이스 방지 — 고구마 폴리라인 끊김 #5)

  function loadKakaoSdk(cb) {
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + window.KAKAO_JS_KEY + '&autoload=false';
    s.onload = () => { kakao.maps.load(cb); };
    s.onerror = () => post({ type: 'error', message: 'kakao sdk script onerror', source: s.src, lineno: 0 });
    document.head.appendChild(s);
  }

  // ── 방향 화살표 헬퍼 (진행 방향 표시 #1) ──────────────
  function _haversineM(p, q) { // p,q = [lng,lat]
    const R = 6371000, toRad = (x) => x * Math.PI / 180;
    const dLat = toRad(q[1] - p[1]), dLng = toRad(q[0] - p[0]);
    const h = Math.sin(dLat/2)**2 + Math.cos(toRad(p[1]))*Math.cos(toRad(q[1]))*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function _bearingDeg(p, q) { // CSS 회전(0=북/위, 시계방향). p,q=[lng,lat]
    const latMid = (p[1] + q[1]) / 2 * Math.PI / 180;
    const dLng = (q[0] - p[0]) * Math.cos(latMid);
    const dLat = (q[1] - p[1]);
    return Math.atan2(dLng, dLat) * 180 / Math.PI;
  }
  function _arrowPoints(coords, spacingM) { // 등간격 화살표 위치 [{lng,lat,deg}]
    const out = [];
    let target = spacingM * 0.5, acc = 0;
    for (let i = 1; i < coords.length; i++) {
      const segLen = _haversineM(coords[i-1], coords[i]);
      if (segLen <= 0) continue;
      const deg = _bearingDeg(coords[i-1], coords[i]);
      while (acc + segLen >= target) {
        const t = (target - acc) / segLen;
        out.push({
          lng: coords[i-1][0] + (coords[i][0] - coords[i-1][0]) * t,
          lat: coords[i-1][1] + (coords[i][1] - coords[i-1][1]) * t,
          deg,
        });
        target += spacingM;
      }
      acc += segLen;
    }
    return out;
  }
  const ARROW_SPACING_M = 300; // 성김 (CEO 선택)

  function drawCourses(courses) {
    // 기존 overlay 제거 (line + label + 방향/시작·끝 extras)
    COURSE_OVERLAYS.forEach((o) => {
      if (o.line) o.line.setMap(null);
      if (o.marker) o.marker.setMap(null);
      if (o.extras) o.extras.forEach((e) => e.setMap(null));
    });
    COURSE_OVERLAYS = [];

    (courses || []).forEach((c) => {
      const color = c.color || '#2563EB';
      const path = c.coordinates.map(([lng, lat]) => new kakao.maps.LatLng(lat, lng));
      const line = new kakao.maps.Polyline({
        path,
        strokeWeight: 5,
        strokeColor: color,
        strokeOpacity: 0.85,
        strokeStyle: 'solid',
      });
      line.setMap(MAP);
      kakao.maps.event.addListener(line, 'click', () => post({ type: 'coursepress', courseId: c.id }));

      const extras = [];
      let marker = null;

      if (c.directional && c.coordinates.length >= 2) {
        // 진행 방향 화살촉 (라인 화살촉, ~300m 간격)
        _arrowPoints(c.coordinates, ARROW_SPACING_M).forEach((a) => {
          const ov = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(a.lat, a.lng),
            content: '<div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid ' + color + ';transform:rotate(' + a.deg + 'deg);filter:drop-shadow(0 0 1px rgba(255,255,255,0.95));"></div>',
            xAnchor: 0.5, yAnchor: 0.5,
          });
          ov.setMap(MAP);
          extras.push(ov);
        });
        // 출발 / 도착 마커 (루프=시작≈끝 → 통합)
        const co = c.coordinates;
        const isLoop = co.length > 2 && _haversineM(co[0], co[co.length - 1]) < 50;
        const startOv = new kakao.maps.CustomOverlay({
          position: path[0],
          content: '<div style="display:flex;flex-direction:column;align-items:center;"><div style="width:14px;height:14px;border-radius:7px;background:#16A34A;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,0.4);"></div><div style="margin-top:2px;background:#16A34A;color:#fff;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap;">' + (isLoop ? '출발·도착' : '출발') + '</div></div>',
          yAnchor: 0.2, xAnchor: 0.5,
        });
        startOv.setMap(MAP);
        extras.push(startOv);
        if (!isLoop) {
          const endOv = new kakao.maps.CustomOverlay({
            position: path[path.length - 1],
            content: '<div style="font-size:20px;filter:drop-shadow(0 0 2px #fff);">🏁</div>',
            yAnchor: 1, xAnchor: 0.3,
          });
          endOv.setMap(MAP);
          extras.push(endOv);
        }
      } else if (path.length > 0 && c.name) {
        // 비방향 코스(내 경로/도보 등) — 이름 라벨. name 이 비면 라벨 생략(인증카드 등 지도 확대 시 가림 방지)
        marker = new kakao.maps.CustomOverlay({
          position: path[0],
          content: '<div style="background:' + color + ';color:#fff;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;">' + c.name + '</div>',
          yAnchor: 1.4,
        });
        marker.setMap(MAP);
      }
      COURSE_OVERLAYS.push({ line, marker, extras });
    });
  }

  let FOLLOW_USER = false;
  let LAST_USER = null;  // 최근 사용자 위치 latLng — "현재 위치로 이동" 버튼용

  function drawUser(userLocation) {
    if (USER_OVERLAY) { USER_OVERLAY.setMap(null); USER_OVERLAY = null; }
    if (!userLocation) return;
    const latLng = new kakao.maps.LatLng(userLocation.lat, userLocation.lng);
    LAST_USER = latLng;
    // 프로필 사진이 있으면 원형 사진 마커, 없으면 파란 점 (#3). 사진 로드 실패 시 점으로 폴백.
    const content = userLocation.imageUrl
      ? '<div style="width:38px;height:38px;border-radius:19px;border:3px solid #fff;box-shadow:0 0 8px rgba(0,0,0,0.45);overflow:hidden;background:#3B82F6;"><img src="' + userLocation.imageUrl + '" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.parentNode.innerHTML=\'\';this.parentNode.style.cssText=\'width:16px;height:16px;border-radius:8px;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 8px rgba(59,130,246,0.6);\'"/></div>'
      : '<div style="width:16px;height:16px;border-radius:8px;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 8px rgba(59,130,246,0.6);"></div>';
    USER_OVERLAY = new kakao.maps.CustomOverlay({
      position: latLng,
      content,
      yAnchor: 0.5, xAnchor: 0.5,
    });
    USER_OVERLAY.setMap(MAP);
    // 사용자 위치 추적 모드 + 사용자 인터랙션 없을 때만 카메라 panTo
    if (FOLLOW_USER && !userInteracted) {
      MAP.panTo(latLng);
    }
  }

  // 코스 폴리라인 전체가 화면에 들어오도록 카메라 자동 fit
  // 사용자가 지도 인터랙션 시작하면 자동 fit 중지 (사용자 zoom/pan 존중)
  let userInteracted = false;
  let lastCourseSignature = null;

  function courseSignature(courses) {
    // 코스 id 들의 변경 감지 — 같은 코스 갱신 시엔 fit 다시 안 함
    return (courses || []).map((c) => c.id).sort().join(",");
  }

  function fitToCourses(courses) {
    if (!courses || courses.length === 0) return;
    const bounds = new kakao.maps.LatLngBounds();
    let any = false;
    courses.forEach((c) => {
      (c.coordinates || []).forEach(([lng, lat]) => {
        bounds.extend(new kakao.maps.LatLng(lat, lng));
        any = true;
      });
    });
    if (any) MAP.setBounds(bounds);
  }

  // RN 측에서 코스/사용자 위치 갱신할 때 호출
  window.updateMapData = function(data) {
    // 맵이 아직 초기화 전이면 최신 데이터를 보관했다가 initMap 끝에 1회 적용.
    // (RN 이 SDK 로드 완료 전에 코스 선택을 주입하면 폴리라인이 통째로 누락되던 #5 원인)
    if (!MAP) { PENDING_DATA = data; return; }
    if (data.followUser !== undefined) FOLLOW_USER = !!data.followUser;
    if (data.courses) {
      drawCourses(data.courses);
      // 코스 ID 가 바뀌면 (= RN 이 새 코스 선택을 주입) 명시적 의도 → 사용자 zoom/pan 여부와
      // 무관하게 항상 재fit. (예전엔 !userInteracted 조건 때문에 첫 fit 의 setBounds 가
      // zoom_changed 를 쏴 userInteracted 가 영구 latch 되고, 이후 다른 코스를 눌러도
      // 카메라가 안 움직이던 버그가 있었다.) 같은 코스 동적 업데이트(trace) 일 때만 zoom 보존.
      const sig = courseSignature(data.courses);
      const courseChanged = sig !== lastCourseSignature;
      lastCourseSignature = sig;
      if (data.courses.length > 0 && courseChanged && !FOLLOW_USER) {
        userInteracted = false;
        fitToCourses(data.courses);
      }
    }
    if (data.userLocation !== undefined) drawUser(data.userLocation);
  };

  // 사용자 인터랙션 (zoom, pan) 감지 시 자동 fit 비활성.
  // FOLLOW_USER (러닝/코스기록 추적) 모드에서는 네비게이션처럼 idle 후 다시 따라가기 재무장.
  let reFollowTimer = null;
  const FOLLOW_REARM_MS = 4500;
  function onUserInteract() {
    userInteracted = true;
    if (!FOLLOW_USER) return;  // 일반 지도는 영구 latch (사용자 zoom/pan 존중)
    if (reFollowTimer) clearTimeout(reFollowTimer);
    reFollowTimer = setTimeout(() => { userInteracted = false; }, FOLLOW_REARM_MS);
  }
  function attachInteractionGuard() {
    if (!MAP) return;
    kakao.maps.event.addListener(MAP, 'zoom_changed', onUserInteract);
    kakao.maps.event.addListener(MAP, 'dragend', onUserInteract);
  }

  // 명시 리셋 (RN 측에서 "fit again" 요청 시)
  window.resetUserInteraction = function() {
    userInteracted = false;
    lastCourseSignature = null;
  };

  // "현재 위치로 이동" — RN 버튼에서 호출. 즉시 사용자 위치로 재중심 + follow 재개.
  window.recenterToUser = function() {
    if (!MAP || !LAST_USER) return;
    userInteracted = false;
    if (reFollowTimer) { clearTimeout(reFollowTimer); reFollowTimer = null; }
    MAP.panTo(LAST_USER);
  };

  function initMap() {
    const data = window.MAP_DATA || {};
    const c = data.center || { lat: 37.566, lng: 126.9784 };
    const center = new kakao.maps.LatLng(c.lat, c.lng);
    MAP = new kakao.maps.Map(document.getElementById('map'), { center, level: data.level || 6 });
    if (data.followUser) FOLLOW_USER = true;

    drawCourses(data.courses || []);
    drawUser(data.userLocation);
    // 초기에도 코스 있으면 자동 fit
    if ((data.courses || []).length > 0) {
      fitToCourses(data.courses);
      lastCourseSignature = courseSignature(data.courses);
    }
    attachInteractionGuard();

    // 지도 타일이 실제로 다 그려질 때마다 RN 에 'mapready' 통지.
    // 완주 인증카드의 오프스크린 지도 캡처가 "고정 3초 대기" 대신 이 신호를 기다렸다가
    // 캡처하도록 하기 위함 (야외 셀룰러 등 느린 망에서 3초 안에 타일이 안 그려져
    // 배경 지도가 통째로 누락되던 문제). setBounds(fitToCourses) 후의 재로딩도 포함해
    // 매 타일로드마다 발신 — RN 측이 디바운스해 마지막(프레이밍 완료) 상태를 캡처한다.
    kakao.maps.event.addListener(MAP, 'tilesloaded', function() {
      post({ type: 'mapready' });
    });

    // 단일 탭은 아래 touchend 에서 터치 기반으로 직접 발신한다 (Kakao 'click' 이 iOS 터치에서
    // 비신뢰라 무반응이던 문제 — 'click' 리스너 의존 제거, 중복 발신 방지).

    // 맵 준비 전 도착했던 업데이트(코스 선택 등) 반영 — #5 폴리라인 끊김 방지
    if (PENDING_DATA) {
      const pending = PENDING_DATA;
      PENDING_DATA = null;
      window.updateMapData(pending);
    }

    // long-press (모바일) — 500ms touchstart 유지
    let lpTimer = null, lpStart = null;
    const mapDiv = document.getElementById('map');
    mapDiv.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      const touch = e.touches[0];
      lpStart = { x: touch.clientX, y: touch.clientY };
      lpTimer = setTimeout(() => {
        const proj = MAP.getProjection();
        const rect = mapDiv.getBoundingClientRect();
        const point = new kakao.maps.Point(lpStart.x - rect.left, lpStart.y - rect.top);
        const latLng = proj.coordsFromContainerPoint(point);
        post({ type: 'longpress', lng: latLng.getLng(), lat: latLng.getLat() });
        lpTimer = null;
      }, 500);
    });
    mapDiv.addEventListener('touchmove', () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } });
    mapDiv.addEventListener('touchend', () => {
      // lpTimer 가 아직 살아있으면 = 500ms 미만 + 이동 없음 → 단일 탭. 터치 기반으로 직접 발신.
      if (lpTimer && lpStart && MAP) {
        clearTimeout(lpTimer); lpTimer = null;
        const proj = MAP.getProjection();
        const rect = mapDiv.getBoundingClientRect();
        const point = new kakao.maps.Point(lpStart.x - rect.left, lpStart.y - rect.top);
        const latLng = proj.coordsFromContainerPoint(point);
        post({ type: 'tap', lng: latLng.getLng(), lat: latLng.getLat() });
      } else if (lpTimer) {
        clearTimeout(lpTimer); lpTimer = null;
      }
      lpStart = null;
    });
  }

  // injectedJavaScriptBeforeContentLoaded 는 Android 에서 inline script 보다
  // 늦게 실행될 수 있으므로 데이터 도착을 폴링 (최대 5초).
  function waitForData(cb, tries) {
    if (window.KAKAO_JS_KEY) return cb();
    if (tries <= 0) {
      post({ type: 'error', message: 'KAKAO_JS_KEY not injected (timeout)', source: 'init', lineno: 0 });
      return;
    }
    setTimeout(() => waitForData(cb, tries - 1), 50);
  }
  waitForData(() => loadKakaoSdk(initMap), 100);
</script>
</body>
</html>
